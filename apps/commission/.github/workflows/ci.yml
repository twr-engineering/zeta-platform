name: CI

# M0.1 deliverable: "CI + migrations + seed script for dev fixtures".
#
# Lint, typecheck/build, and unit tests on every push and PR. No secrets are
# used: the build runs on PLACEHOLDER credentials, which the foundation made
# safe by keeping every authenticated route dynamic (a prerendered route would
# construct a Supabase client at build time and fail). If someone accidentally
# makes an authenticated route static, this job is what catches it.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SUPABASE_URL: PLACEHOLDER_PENDING_CREDENTIALS
      NEXT_PUBLIC_SUPABASE_ANON_KEY: PLACEHOLDER_PENDING_CREDENTIALS
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # 22, not 20: the unit tests are TypeScript run directly by
          # `node --test`, and type stripping only became on-by-default in
          # 22.18. On 20 they do not run at all.
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm run test:unit

      # M1.5 perf budget (FR-M1-07). The DB-bound targets (deal-list P95,
      # full bulk recompute) run live via `pnpm run perf:recompute` against a
      # real project; here — with no database — test:unit already proved the
      # engine budget over 1,000 synthetic deals (tests/unit/perf.test.ts:
      # single compute < 10 ms, 1,000-deal engine recompute a fraction of 30 s).
      # This step calls the live harness too, which self-skips on the placeholder
      # credentials CI runs with, so it is green here and real when creds exist.
      - name: Recompute perf harness (self-skips without live credentials)
        run: pnpm run perf:recompute

      # M5.4 perf budget (M5 PRD §8, DoD): the 1,000-payment load fixture and the
      # four payment targets (list P95 < 500 ms, create round-trip < 300 ms, split
      # preview < 100 ms, picker < 150 ms). Same self-skipping contract as the
      # recompute harness — on the placeholder credentials CI runs with it prints
      # "skipped" and exits 0; against a real project it seeds 1,000 deals+payments,
      # measures server time (WAN round-trips subtracted), and fails the build if any
      # target is missed.
      - name: Payments perf harness (self-skips without live credentials)
        run: pnpm run perf:payments

      # M6 dashboard perf budget (M6 PRD §8): the full eight-section read < 1.5 s and
      # the year-filter switch < 500 ms at 1,000 deals + 1,000 payments. Same
      # self-skipping contract — "skipped" on the placeholder credentials CI runs
      # with; against a real project it seeds 1,000×3 rows, measures the true server
      # execution (EXPLAIN ANALYZE, machine-independent) plus the pure compose CPU,
      # and fails the build if either target is missed.
      - name: Dashboard perf harness (self-skips without live credentials)
        run: pnpm run perf:dashboard

      # M2 Yield Summary perf budget (M2 PRD §8 / criterion 13): the report read
      # < 500 ms P95 at 1,000 deals. Same self-skipping contract — "skipped" on the
      # placeholder credentials CI runs with; against a real project it seeds 1,000
      # deals, rebuilds the materialized aggregate, and measures the three parallel
      # reads' true server execution (EXPLAIN ANALYZE), failing the build if missed.
      - name: Yield perf harness (self-skips without live credentials)
        run: pnpm run perf:yield

      # M3 pace budget (M3 PRD §8): Rule P12's YTD aggregate over ≥ 1,000 deals
      # < 300 ms P95. Same self-skipping contract — seeds 1,000 deals across three
      # booked years and measures plan_ytd_actual_sales' true server execution
      # (EXPLAIN ANALYZE) both OQ-1 flag ways, failing the build if the budget is missed.
      - name: Plan-YTD perf harness (self-skips without live credentials)
        run: pnpm run perf:plan-ytd

      # M7 Source Performance perf budget (M7 PRD §8 / criterion 10): the report and
      # each year-filter change < 500 ms P95 at 1,000 deals / 1,000 payments / 60
      # sources. Same self-skipping contract — "skipped" on the placeholder credentials
      # CI runs with; against a real project it seeds 1,000 deals across 60 sources and
      # measures the two parallel reads' true server execution (EXPLAIN ANALYZE) plus
      # the pure sourcePerformance() compose, failing the build if the budget is missed.
      - name: Source Performance perf harness (self-skips without live credentials)
        run: pnpm run perf:source-performance

      # Also typechecks — `next build` runs tsc, which is what enforces the
      # money-safe types (a float in a rate column fails to compile).
      - name: Build
        run: pnpm run build
